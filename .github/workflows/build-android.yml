name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "debug (langsung bisa di-install) atau release (unsigned)"
        type: choice
        default: debug
        options:
          - debug
          - release
      target:
        description: "ABI target Android"
        type: choice
        default: aarch64
        options:
          - aarch64
          - all
      release_tag:
        description: "Opsional: tag GitHub Release tujuan upload langsung (mis. v0.1.0-alpha.5)"
        type: string
        default: ""
      existing_run_id:
        description: "Opsional: ID workflow run Android sebelumnya untuk langsung di-upload ke release_tag tanpa build ulang"
        type: string
        default: ""

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  android:
    if: ${{ inputs.existing_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The env context is not available in job-level env, so export the runner's NDK path here.
      - name: Point NDK_HOME at the runner NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            ${{ inputs.target == 'all'
              && 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android'
              || 'aarch64-linux-android' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Initialize Tauri Android project
        run: |
          npx tauri android init --ci
          npx tauri icon public/icons/icon-512.png --ios-color "#136f5a"
          node scripts/patch-android-manifest.mjs

      - name: Build APK
        env:
          # Baked into the app so users never have to type a sync server address.
          VITE_SYNC_URL: ${{ vars.VITE_SYNC_URL }}
        run: |
          ARGS="--apk"
          if [ "${{ inputs.build_type || 'release' }}" = "debug" ]; then
            ARGS="$ARGS --debug"
          fi
          if [ "${{ inputs.target || 'aarch64' }}" != "all" ]; then
            ARGS="$ARGS --target ${{ inputs.target || 'aarch64' }}"
          fi
          npx tauri android build $ARGS

      - name: Sign release APK with debug keystore so it installs directly
        if: ${{ (inputs.build_type || 'release') == 'release' }}
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          KEYSTORE="$HOME/.android/kafi-debug.keystore"
          mkdir -p "$HOME/.android"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Kafi Debug,O=Kafi,C=ID"
          fi
          for apk in $(find src-tauri/gen/android/app/build/outputs/apk -name "*unsigned.apk"); do
            aligned="${apk%-unsigned.apk}-signed.apk"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$apk" "$aligned"
            "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android "$aligned"
            rm -f "$apk" "${aligned}.idsig"
            ls -lh "$aligned"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kafi-android-${{ inputs.build_type || 'release' }}-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload APK directly to GitHub Release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          ASSET_NAME="kafi-${{ inputs.release_tag }}-android-arm64.apk"
          ASSET_NAME="${ASSET_NAME/kafi-v/kafi-}"
          cp "$APK" "$ASSET_NAME"
          gh release upload "${{ inputs.release_tag }}" "$ASSET_NAME" --clobber

  attach-existing:
    if: ${{ inputs.existing_run_id != '' && inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download existing APK artifact and upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apk-dl
          gh run download "${{ inputs.existing_run_id }}" --repo "${{ github.repository }}" -D apk-dl
          APK=$(find apk-dl -name "*.apk" | head -n 1)
          ASSET_NAME="kafi-${{ inputs.release_tag }}-android-arm64.apk"
          ASSET_NAME="${ASSET_NAME/kafi-v/kafi-}"
          cp "$APK" "$ASSET_NAME"
          ls -lh "$ASSET_NAME"
          gh release upload "${{ inputs.release_tag }}" "$ASSET_NAME" --repo "${{ github.repository }}" --clobber

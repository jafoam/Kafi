name: Build iOS IPA (Unsigned Sideload)

on:
  workflow_dispatch:

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run typecheck

      - name: Build lightweight frontend bundle
        env:
          CF_PAGES: "1"
          VITE_SYNC_URL: ${{ vars.VITE_SYNC_URL }}
        run: npm run build

      - name: Initialize Tauri iOS project
        run: |
          node -e 'const fs=require("fs"); const p="src-tauri/tauri.conf.json"; const c=JSON.parse(fs.readFileSync(p,"utf8")); c.build.beforeBuildCommand="npm run build"; c.bundle.resources=[]; fs.writeFileSync(p, JSON.stringify(c,null,2));'
          npx tauri ios init --ci
          npx tauri icon public/icons/icon-512.png --ios-color "#136f5a"
          INFO_PLIST=$(find src-tauri/gen/apple -name "Info.plist" -path "*iOS*" | head -n 1)
          if [ -n "$INFO_PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Kafi membutuhkan mikrofon untuk fitur Tasmi hafalan Al-Quran.'" "$INFO_PLIST" \
              || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'Kafi membutuhkan mikrofon untuk fitur Tasmi hafalan Al-Quran.'" "$INFO_PLIST"
          fi

      - name: Build unsigned iOS app and package IPA
        env:
          CF_PAGES: "1"
          VITE_SYNC_URL: ${{ vars.VITE_SYNC_URL }}
        run: |
          XCODEPROJ=$(find src-tauri/gen/apple -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          SCHEME=$(xcodebuild -list -project "$XCODEPROJ" | awk '/Schemes:/{flag=1;next} flag && /iOS/{print $1; exit}')
          echo "Project: $XCODEPROJ | Scheme: $SCHEME"
          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build-ios \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH=$(find build-ios/Build/Products -name "*.app" | head -n 1)
          echo "Built app: $APP_PATH"
          mkdir -p ipa-out/Payload
          cp -R "$APP_PATH" ipa-out/Payload/
          (cd ipa-out && zip -qry ../kafi-ios-unsigned.ipa Payload)
          ls -lh kafi-ios-unsigned.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: kafi-ios-unsigned-ipa
          path: kafi-ios-unsigned.ipa
          if-no-files-found: error

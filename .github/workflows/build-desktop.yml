name: Build Desktop (Windows / macOS)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform"
        type: choice
        default: windows
        options:
          - windows
          - macos
          - all

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            bundles: nsis,msi
            artifact_path: src-tauri/target/release/bundle/nsis/*.exe
            msi_path: src-tauri/target/release/bundle/msi/*.msi
          - os: macos-latest
            platform: macos
            bundles: dmg
            artifact_path: src-tauri/target/release/bundle/dmg/*.dmg
            msi_path: ""
    if: ${{ inputs.platform == 'all' || inputs.platform == matrix.platform || (inputs.platform == '' && matrix.platform == 'windows') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build lightweight desktop installer
        shell: bash
        env:
          VITE_SYNC_URL: ${{ vars.VITE_SYNC_URL }}
        run: >-
          npx tauri build
          --bundles "${{ matrix.bundles }}"
          --config '{"build":{"beforeBuildCommand":"npm run build"},"bundle":{"resources":[]}}'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: kafi-desktop-${{ matrix.platform }}
          path: |
            ${{ matrix.artifact_path }}
            ${{ matrix.msi_path }}
          if-no-files-found: error
